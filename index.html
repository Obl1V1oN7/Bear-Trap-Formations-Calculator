<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Trap Formations Calculator</title>
<style>
body { font-family: Arial; background:#0f172a; color:#e2e8f0; text-align:center; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#1e293b; padding:15px; border-radius:12px; margin:10px 0; }
.row { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; }
label { width:220px; text-align:right; }
input { padding:6px; margin:4px; width:140px; border-radius:6px; border:none; }
button { padding:10px 15px; border:none; border-radius:8px; background:#38bdf8; cursor:pointer; }
.result { margin-top:10px; }
.formation { background:#334155; padding:10px; border-radius:10px; margin:8px 0; }
.small { font-size:12px; opacity:0.7; }
.switch { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
<h1>🐻 Bear Trap Formations Calculator</h1>

<div class="card">
<h3>Settings</h3>
<div class="row"><label>Troops limit:</label><input id="limit" type="number" value="120000"></div>
<div class="row"><label>Formations count:</label><input id="formations" type="number" value="3"></div>
<div class="row"><label>⚔️ Infantry available:</label><input id="infantry" type="number"></div>
<div class="row"><label>🛡 Lancers available:</label><input id="spearmen" type="number"></div>
<div class="row"><label>🏹 Marksmen available:</label><input id="archers" type="number"></div>

<div class="switch">
<label>Equal distribution mode</label>
<input type="checkbox" id="equalMode" checked>
</div>

<button onclick="calculate()">Calculate</button>
</div>

<div id="results" class="result"></div>

<div class="card">
<h3>Manual formation (independent)</h3>
<div class="row"><label>⚔️ Infantry:</label><input id="m_inf" type="number" value="0"></div>
<div class="row"><label>🛡 Lancers:</label><input id="m_sp" type="number" value="0"></div>
<div class="row"><label>🏹 Marksmen:</label><input id="m_ar" type="number" value="0"></div>
<button onclick="calculate()">Apply</button>
<div id="manualResult" class="small"></div>
</div>

</div>

<script>
function calculate() {
    let limit = +document.getElementById('limit').value;
    let count = +document.getElementById('formations').value;

    let inf = +document.getElementById('infantry').value;
    let sp = +document.getElementById('spearmen').value;
    let ar = +document.getElementById('archers').value;

    let equalMode = document.getElementById('equalMode').checked;

    let mInf = +document.getElementById('m_inf').value;
    let mSp = +document.getElementById('m_sp').value;
    let mAr = +document.getElementById('m_ar').value;

    let manualSum = mInf + mSp + mAr;
    let manualResult = document.getElementById('manualResult');

    manualResult.innerHTML = '✅ Manual formation applied';

    inf -= mInf;
    sp -= mSp;
    ar -= mAr;

    if (inf < 0 || sp < 0 || ar < 0) {
        manualResult.innerHTML = '❌ Not enough troops for manual formation';
        return;
    }

    let resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    let manualDiv = document.createElement('div');
    manualDiv.className = 'formation';
    manualDiv.innerHTML = `<b>Manual formation</b><br>
    ⚔️ Infantry: ${mInf}<br>
    🛡 Lancers: ${mSp}<br>
    🏹 Marksmen: ${mAr}`;
    resultsDiv.appendChild(manualDiv);

    let minInf = limit * 0.05;

    for (let i = 1; i <= count; i++) {
        let archers, lancers, infantry;

        if (equalMode) {
            let targetA = ar / (count - i + 1);
            let targetS = sp / (count - i + 1);

            archers = Math.min(ar, targetA);
            let arDef = targetA - archers;

            lancers = Math.min(sp, targetS + arDef);

            infantry = limit - archers - lancers;

            // enforce minimum infantry
            if (infantry < minInf) {
                let deficit = minInf - infantry;

                let takeFromLancers = Math.min(deficit, lancers - (limit * 0.05));
                lancers -= takeFromLancers;
                deficit -= takeFromLancers;

                archers -= Math.min(deficit, archers);

                infantry = limit - archers - lancers;
            }

        } else {
            let targetA = ar / (count - i + 1);
            let targetS = sp / (count - i + 1);

            archers = Math.min(ar, targetA);
            lancers = Math.min(sp, targetS);
            infantry = limit - archers - lancers;

            if (infantry < minInf) infantry = minInf;
        }

        ar -= archers;
        sp -= lancers;
        inf -= infantry;

        let div = document.createElement('div');
        div.className = 'formation';
        div.innerHTML = `<b>Formation ${i}</b><br>
        🏹 Marksmen: ${Math.round(archers)}<br>
        🛡 Lancers: ${Math.round(lancers)}<br>
        ⚔️ Infantry: ${Math.round(infantry)}`;
        resultsDiv.appendChild(div);
    }
}
</script>

</body>
</html>
