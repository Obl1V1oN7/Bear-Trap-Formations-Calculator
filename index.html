<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Trap Formations Calculator</title>
<style>
body {font-family: Arial;background:#0f172a;color:#e2e8f0;text-align:center;margin:0;}
.container {max-width:900px;margin:auto;padding:12px;}
.card {background:#1e293b;padding:14px;border-radius:12px;margin:10px 0;}
h1 { font-size:22px; }
.row {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;}
label {flex:1;text-align:left;min-width:140px;}
input {padding:8px;width:100%;max-width:220px;border-radius:8px;border:none;}
button {padding:12px;width:100%;border:none;border-radius:10px;background:#38bdf8;cursor:pointer;font-weight:bold;}
.formation {background:#334155;padding:10px;border-radius:10px;margin:8px 0;text-align:left;}
.switch {display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.small { font-size:12px; opacity:0.7; }
@media (max-width:600px){label { min-width:100%; } input { max-width:100%; }}
</style>
</head>
<body>
<div class="container">

<h1>🐻 Bear Trap Formations Calculator</h1>

<div class="card">
<h3>Settings</h3>

<div class="row"><label>Troops limit ⚔️</label><input id="limit" type="number" value="120000"></div>
<div class="row"><label>Formations count</label><input id="formations" type="number" value="3"></div>
<div class="row"><label>⚔️ Infantry</label><input id="infantry" type="number"></div>
<div class="row"><label>🛡 Lancers</label><input id="spearmen" type="number"></div>
<div class="row"><label>🏹 Marksmen</label><input id="archers" type="number"></div>

<div class="switch">
<span>Equal distribution mode</span>
<input type="checkbox" id="equalMode" checked>
</div>

<div class="switch">
<span>Use 10/10/80 instead of 5/5/90</span>
<input type="checkbox" id="ratioMode">
</div>

<div class="small">
ON: Equal split with priority 🏹 → 🛡 → ⚔️<br>
OFF: Fill each formation by ratio + priority<br>
Ratio switch: 5/5/90 or 10/10/80
</div>

<button onclick="calculate()">Calculate</button>
</div>

<div id="results"></div>

<div class="card">
<h3>Manual formation (no limit)</h3>
<div class="row"><label>⚔️ Infantry</label><input id="m_inf" type="number" value="0"></div>
<div class="row"><label>🛡 Lancers</label><input id="m_sp" type="number" value="0"></div>
<div class="row"><label>🏹 Marksmen</label><input id="m_ar" type="number" value="0"></div>
<button onclick="calculate()">Apply</button>
</div>

</div>

<script>
function calculate(){
    const limit = +document.getElementById('limit').value;
    const count = +document.getElementById('formations').value;

    let inf = +document.getElementById('infantry').value || 0;
    let sp = +document.getElementById('spearmen').value || 0;
    let ar = +document.getElementById('archers').value || 0;

    const equal = document.getElementById('equalMode').checked;
    const ratio10 = document.getElementById('ratioMode').checked;

    const mInf = +document.getElementById('m_inf').value || 0;
    const mSp = +document.getElementById('m_sp').value || 0;
    const mAr = +document.getElementById('m_ar').value || 0;

    const res = document.getElementById('results');
    res.innerHTML = '';

    inf -= mInf; sp -= mSp; ar -= mAr;

    res.innerHTML += `<div class="formation"><b>Manual formation</b><br>
    ⚔️ Infantry: ${mInf}<br>
    🛡 Lancers: ${mSp}<br>
    🏹 Marksmen: ${mAr}</div>`;

    const infRatio = ratio10 ? 0.10 : 0.05;
    const lanRatio = ratio10 ? 0.10 : 0.05;
    const marRatio = ratio10 ? 0.80 : 0.90;

    for(let i=1;i<=count;i++){
        let marksmen=0,lancers=0,infantry=0;

        if(equal){
            const remaining = count - i + 1;

            marksmen = Math.min(ar / remaining, limit * marRatio);

            let space = limit - marksmen;
            let maxLancers = Math.max(0, space - (limit * infRatio));

            lancers = Math.min(sp / remaining, maxLancers);

            infantry = limit - marksmen - lancers;

            if(infantry < limit * infRatio){
                let deficit = (limit * infRatio) - infantry;

                let take = Math.min(deficit, lancers);
                lancers -= take;
                deficit -= take;

                take = Math.min(deficit, marksmen);
                marksmen -= take;

                infantry = limit * infRatio;
            }

        } else {
            // strict ratio-based priority (Marksmen -> Lancers -> Infantry)
            let targetMarksmen = limit * marRatio;
            marksmen = Math.min(ar, targetMarksmen);

            let remainingSpace = limit - marksmen;

            // Lancers should take priority over infantry
            let minInfantry = limit * infRatio;
            let maxLancers = remainingSpace - minInfantry;
            if (maxLancers < 0) maxLancers = 0;

            // Lancers take ALL available space after marksmen (priority over infantry)
            lancers = Math.min(sp, maxLancers);

            // Infantry gets the rest
            infantry = limit - marksmen - lancers;

            // Ensure infantry minimum
            if(infantry < minInfantry){
                let deficit = minInfantry - infantry;

                // reduce lancers first (since they have lower priority than marksmen)
                let take = Math.min(deficit, lancers);
                lancers -= take;
                deficit -= take;

                // then marksmen if needed
                take = Math.min(deficit, marksmen);
                marksmen -= take;

                infantry = minInfantry;
            }
        }

        ar -= marksmen;
        sp -= lancers;
        inf -= infantry;

        res.innerHTML += `<div class="formation"><b>Formation ${i}</b><br>
        🏹 Marksmen: ${Math.round(marksmen)}<br>
        🛡 Lancers: ${Math.round(lancers)}<br>
        ⚔️ Infantry: ${Math.round(infantry)}</div>`;
    }
}
</script>

</body>
</html>
